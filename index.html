
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* NEXO PETROLEUM THEME (PREMIUM) */
        --bg-main: #05161d;
        --bg-card: rgba(10, 30, 40, 0.6);
        --bg-sidebar: #041218;
        --bg-header: rgba(5, 22, 29, 0.85);
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --text-deep: #475569;
        --border-subtle: rgba(255, 255, 255, 0.05);
        --border-accent: rgba(16, 185, 129, 0.1);
        
        --emerald-primary: #10b981;
        --emerald-hover: #059669;
        --track-bg: #081d26;
      }

      .light-theme {
        --bg-main: #F1F5F9; 
        --bg-card: #FFFFFF; 
        --bg-sidebar: #FFFFFF;
        --bg-header: rgba(255, 255, 255, 0.9);
        --text-main: #020617; 
        --text-muted: #475569; 
        --text-deep: #64748B;
        --border-subtle: rgba(16, 185, 129, 0.1);
        --border-accent: rgba(16, 185, 129, 0.4); 
        --track-bg: #E2E8F0;
      }
      
      html {
        scrollbar-gutter: stable;
        background-color: var(--bg-main);
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        color: var(--text-muted);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #nexo-bg-canvas {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-color: var(--bg-main);
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.02) 0, transparent 50%),
          url('https://grainy-gradients.vercel.app/noise.svg');
        filter: contrast(110%) brightness(100%);
        opacity: 0.15;
        pointer-events: none;
        transition: background-color 0.4s ease;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: var(--track-bg); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--emerald-primary); border-radius: 10px; }

      .page-enter { animation: revealPage 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes revealPage {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .glass-card {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-subtle);
        transition: all 0.3s ease;
      }

      .light-theme .glass-card {
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.05);
      }

      .light-theme .text-white, .light-theme .text-slate-100, .light-theme .text-slate-200, .light-theme .text-slate-300 { color: var(--text-main) !important; }
      .light-theme .text-slate-400, .light-theme .text-slate-500 { color: var(--text-muted) !important; }
      .light-theme .bg-slate-950, .light-theme .bg-black { background-color: #FFFFFF !important; }
      .light-theme .bg-white\/\[0\.02\], .light-theme .bg-white\/5 { background-color: rgba(0,0,0,0.02) !important; }
      .light-theme .border-white\/5, .light-theme .border-white\/10 { border-color: rgba(0,0,0,0.08) !important; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>

    <div id="nexo-bg-canvas"></div>
    <div id="root"></div>

</html>
