
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* NEXO PREMIUM PETROLEUM THEME (DARK CLEAN) */
        --bg-main: #10161a;        /* Fundo principal mais suave */
        --bg-card: #161f24;        /* Card com elevação sutil */
        --bg-sidebar: #0d1216;
        --bg-header: rgba(16, 22, 26, 0.85);
        --text-main: #f8fafc;
        --text-muted: #8292a2;     /* Cinza azulado para leitura suave */
        --text-deep: #415262;
        --border-subtle: rgba(255, 255, 255, 0.04);
        --border-accent: rgba(16, 185, 129, 0.1);
        
        --emerald-primary: #10b981;
        --emerald-hover: #34d399;
        --track-bg: #1a2329;
      }

      .light-theme {
        --bg-main: #f1f5f9; 
        --bg-card: #ffffff; 
        --bg-sidebar: #f8fafc;
        --bg-header: rgba(241, 245, 249, 0.9);
        --text-main: #0f172a; 
        --text-muted: #64748b; 
        --text-deep: #94a3b8;
        --border-subtle: rgba(15, 23, 42, 0.06);
        --border-accent: rgba(16, 185, 129, 0.3); 
        --track-bg: #e2e8f0;
      }
      
      html {
        scrollbar-gutter: stable;
        background-color: var(--bg-main);
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        color: var(--text-muted);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #nexo-bg-canvas {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-color: var(--bg-main);
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.02) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.01) 0, transparent 50%);
        pointer-events: none;
        transition: background-color 0.4s ease;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: var(--track-bg); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--text-deep); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--emerald-primary); }

      .page-enter { animation: revealPage 0.4s cubic-bezier(0, 0, 0.2, 1); }
      @keyframes revealPage {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        transition: all 0.25s ease;
      }

      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
      }

      .light-theme .glass-card {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
      }
      
      .light-theme .glass-card:hover {
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        border-color: rgba(16, 185, 129, 0.1);
      }

      .mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Typography smoothing */
      h1, h2, h3, h4 { letter-spacing: -0.02em; }
    </style>
    <script type="importmap">
{

    "react": "https://esm.sh/react@19.0.0",

    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>

    <div id="nexo-bg-canvas"></div>

</html>
