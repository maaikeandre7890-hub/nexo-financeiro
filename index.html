
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-petroleum-base: #020608;
        --bg-petroleum-deep: #000000;
        --bg-surface: rgba(2, 12, 16, 0.7);
        --emerald-primary: #10b981;
        --border-glass: rgba(255, 255, 255, 0.04);
        --border-glass-bright: rgba(255, 255, 255, 0.08);
      }
      
      body {
        background-color: var(--bg-petroleum-base);
        color: #94A3B8;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.015em;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.03) 0, transparent 50%);
        z-index: -2;
      }

      .glass-card {
        background: var(--bg-surface);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--border-glass);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        border-color: var(--border-glass-bright);
        background: rgba(4, 20, 26, 0.85);
        transform: translateY(-4px);
        box-shadow: 0 30px 60px -15px rgba(16, 185, 129, 0.15);
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Melhoria na barra de rolagem para discrição premium */
      .custom-scrollbar::-webkit-scrollbar { width: 3px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.05); border-radius: 20px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--emerald-primary); }

      /* Transições de página suaves */
      .page-enter {
        animation: revealPage 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes revealPage {
        from { opacity: 0; transform: scale(0.98) translateY(20px); filter: blur(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      }

      .heading-xl { font-size: clamp(2.5rem, 8vw, 6rem); line-height: 0.85; font-weight: 900; letter-spacing: -0.05em; }
      
      /* Inputs de Luxo */
      input, select {
        transition: all 0.3s ease;
      }
      input:focus, select:focus {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }

      /* Botões táteis mobile */
      @media (max-width: 768px) {
        .tap-target { min-height: 54px; }
      }
    </style>

}
