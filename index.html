
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0B0D10;
        --bg-sidebar: #0B0D10;
        --bg-card: #15181D;
        --bg-header: rgba(11, 13, 16, 0.95);
        --text-main: #FFFFFF;
        --text-muted: #B5B7BA;
        --text-deep: #8A8D91;
        --border-subtle: rgba(255, 255, 255, 0.06);
        --emerald-primary: #10b981;
        --track-bg: #0B0D10;
      }

      .light-theme {
        --bg-main: #F4F7F9;
        --bg-sidebar: #F4F7F9;
        --bg-card: #FFFFFF;
        --bg-header: rgba(244, 247, 249, 0.95);
        --text-main: #1A1C21;
        --text-muted: #4B4E52;
        --text-deep: #7A7D81;
        --border-subtle: rgba(16, 185, 129, 0.15);
        --track-bg: #E2E8F0;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        position: fixed;
        overscroll-behavior-y: none;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding-top: 24px; /* Ajuste: Conteúdo não gruda no topo */
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--emerald-primary); border-radius: 10px; }

      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @media (max-width: 768px) {
        .glass-card { border-radius: 16px; }
        h1 { font-size: clamp(1.5rem, 7vw, 2.25rem); }
        h2 { font-size: clamp(1.25rem, 6vw, 1.75rem); }
      }

      .mono { font-family: 'JetBrains Mono', monospace; }
      
      .page-enter { 
        animation: revealPage 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
        will-change: transform, opacity;
      }

      @keyframes revealPage {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      input, select, textarea {
        font-size: 16px !important;
      }
      
      @media (max-width: 768px) {
        button, .btn {
          min-height: 44px;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>
  <body class="pt-safe">
    <div id="root"></div>
  </body>
</html>
