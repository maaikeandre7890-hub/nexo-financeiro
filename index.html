
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NEXO | High-End Financial Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-obsidian: #000000;
        --surface-deep: #030303;
        --emerald-primary: #10b981;
      }
      
      body {
        background-color: var(--bg-obsidian);
        color: #4b4b4b;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.03em;
        overscroll-behavior-y: contain;
      }

      /* Ruído de Luxo em toda a tela */
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.015;
        pointer-events: none;
        z-index: 9999;
      }

      .glass-card {
        background: #050505;
        border: 1px solid rgba(255, 255, 255, 0.02);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        border-color: rgba(16, 185, 129, 0.15);
        background: #080808;
        transform: translateY(-5px);
        box-shadow: 0 50px 100px -20px rgba(0,0,0,1);
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Scrollbar Invisível mas funcional */
      .custom-scrollbar::-webkit-scrollbar { width: 1px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #111; }

      .page-enter {
        animation: premiumReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes premiumReveal {
        from { opacity: 0; transform: translateY(12px) scale(0.98); filter: blur(10px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }

      h1, h2, h3, .font-black {
        letter-spacing: -0.07em;
      }

      ::selection {
        background-color: rgba(16, 185, 129, 0.4);
        color: white;
      }
    </style>

  }
}
</script>
