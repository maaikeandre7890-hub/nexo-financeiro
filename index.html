
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXO | Intelligence System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-absolute: #02040a;
        --surface-glass: rgba(10, 15, 30, 0.4);
        --border-pro: rgba(255, 255, 255, 0.05);
      }
      
      body {
        background-color: var(--bg-absolute);
        color: #e2e8f0;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Textura de Fibra Digital */
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.03;
        pointer-events: none;
        z-index: 100;
        filter: contrast(120%) brightness(100%);
      }

      /* Mesh Gradients Atmosféricos */
      .bg-mesh {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 40%),
          radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.03) 0px, transparent 40%),
          radial-gradient(at 50% 50%, rgba(2, 4, 10, 1) 0px, transparent 100%);
        z-index: -1;
      }

      .glass-card {
        background: var(--surface-glass);
        backdrop-filter: blur(25px) saturate(150%);
        border: 1px solid var(--border-pro);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        background: rgba(15, 23, 42, 0.6);
        border-color: rgba(16, 185, 129, 0.2);
        transform: translateY(-4px);
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      .label-pro {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #475569;
      }

      .heading-pro {
        letter-spacing: -0.05em;
        font-weight: 900;
      }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { 
        background: rgba(255, 255, 255, 0.05); 
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>
  <body>
    <div class="bg-mesh"></div>
    <div id="root"></div>
  </body>
</html>
