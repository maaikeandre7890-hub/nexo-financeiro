
<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg-main: #020608;
        --bg-sidebar: #000000;
        --accent: #10b981;
        --text-main: #F8FAFC;
        --border-subtle: rgba(255, 255, 255, 0.05);
      }

      body {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        letter-spacing: -0.02em;
      }

      input, button, select, textarea, span, p, h1, h2, h3, h4 {
        font-family: 'Space Grotesk', sans-serif !important;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-subtle);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(255, 255, 255, 0.04);
        transform: translateY(-2px);
      }

      .text-gradient-white {
        background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.6) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-gradient-emerald {
        background: linear-gradient(180deg, #10b981 0%, #059669 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-glow-emerald {
        text-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
      }

      @keyframes page-enter {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-enter {
        animation: page-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 3px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }
      
      /* Light Mode Overrides for High Contrast */
      .light-theme {
        --bg-main: #F8FAFC;
        --text-main: #0F172A;
        --border-subtle: rgba(15, 23, 42, 0.08);
      }
      .light-theme .glass-card {
        background: #FFFFFF;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.03);
      }
      .light-theme .glass-card:hover {
        box-shadow: 0 20px 60px rgba(16, 185, 129, 0.08);
        border-color: rgba(16, 185, 129, 0.4);
      }
    </style>

  }
}
</script>
