
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* NEXO DARK (DEFAULT) */
        --bg-main: #020608;
        --bg-card: rgba(2, 12, 16, 0.7);
        --bg-sidebar: #020608;
        --bg-header: rgba(2, 6, 8, 0.9);
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --text-deep: #475569;
        --border-subtle: rgba(255, 255, 255, 0.04);
        --border-accent: rgba(16, 185, 129, 0.1);
        
        --emerald-primary: #10b981;
        --emerald-hover: #059669;
        --track-bg: #0a0f12;
      }

      .light-theme {
        /* NEXO LIGHT PREMIUM - CONTRASTE REFINADO */
        --bg-main: #E2E8F0; 
        --bg-card: #FFFFFF; 
        --bg-sidebar: #FFFFFF;
        --bg-header: rgba(226, 232, 240, 0.95);
        --text-main: #0F172A; /* Cinza Profundo para Leitura */
        --text-muted: #334155; 
        --text-deep: #64748B;
        --border-subtle: rgba(16, 185, 129, 0.12);
        --border-accent: rgba(16, 185, 129, 0.5); 
        --track-bg: #CBD5E1;
      }
      
      html {
        scrollbar-gutter: stable;
        background-color: var(--bg-main);
        height: 100%;
        width: 100%;
        overflow: hidden;
        transition: background-color 0.4s ease;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        color: var(--text-muted);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #nexo-bg-canvas {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-color: var(--bg-main);
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.03) 0, transparent 50%),
          url('https://grainy-gradients.vercel.app/noise.svg');
        filter: contrast(150%) brightness(100%);
        opacity: 0.15;
        pointer-events: none;
        transform: translateZ(0);
        transition: background-color 0.4s ease;
      }

      /* SCROLLBAR REFINEMENT */
      .custom-scrollbar::-webkit-scrollbar { 
        width: 5px; 
        height: 5px; 
      }
      .custom-scrollbar::-webkit-scrollbar-track { 
        background: var(--track-bg); 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: var(--emerald-primary); 
        border-radius: 10px;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
        background: var(--emerald-hover); 
      }

      /* Firefox Support */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--emerald-primary) var(--track-bg);
      }

      .page-enter {
        animation: revealPage 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes revealPage {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* GLASS CARD BASE (MODO ESCURO) */
      .glass-card {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border-subtle);
        transition: all 0.4s ease;
      }

      /* GLASS CARD OVERRIDES FOR LIGHT THEME */
      .light-theme .glass-card {
        background: var(--bg-card);
        border: 2px solid transparent;
        background-image: linear-gradient(var(--bg-card), var(--bg-card)), 
                          linear-gradient(135deg, rgba(16, 185, 129, 0.5) 0%, rgba(16, 185, 129, 0.1) 100%);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        box-shadow: 0 15px 45px -15px rgba(0,0,0,0.08), 0 5px 15px -5px rgba(0,0,0,0.04);
      }

      /* TEXT CONTRAST LOGIC PER THEME */
      .light-theme .text-white, 
      .light-theme .text-slate-100, 
      .light-theme .text-slate-200, 
      .light-theme .text-slate-300 { color: var(--text-main) !important; }
      
      .light-theme .text-slate-400, 
      .light-theme .text-slate-500 { color: var(--text-muted) !important; }
      
      .light-theme .text-slate-600, 
      .light-theme .text-slate-700, 
      .light-theme .text-slate-800 { color: var(--text-deep) !important; }

      .light-theme .bg-slate-950 { background-color: var(--bg-sidebar) !important; }
      .light-theme .bg-black { background-color: var(--bg-sidebar) !important; }
      .light-theme .bg-zinc-900 { background-color: #F1F5F9 !important; }
      .light-theme .bg-white\/\[0\.01\], 
      .light-theme .bg-white\/\[0\.02\], 
      .light-theme .bg-white\/\[0\.03\], 
      .light-theme .bg-white\/\[0\.04\] { background-color: rgba(16, 185, 129, 0.015) !important; }

      .light-theme .border-white\/\[0\.03\],
      .light-theme .border-white\/\[0\.05\],
      .light-theme .border-white\/5,
      .light-theme .border-white\/10 { border-color: var(--border-subtle) !important; }
      
      .light-theme .divide-white\/\[0\.02\] > * { border-color: var(--border-subtle) !important; }

      /* FORM CONTROL CONTRAST */
      .light-theme input, 
      .light-theme select, 
      .light-theme textarea {
        background-color: rgba(0, 0, 0, 0.02) !important;
        color: var(--text-main) !important;
        border-color: rgba(0, 0, 0, 0.08) !important;
      }
      .light-theme input::placeholder {
        color: var(--text-deep) !important;
        opacity: 0.5;
      }
    </style>

{

}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>
  <body>
    <div id="nexo-bg-canvas"></div>
    <div id="root"></div>

</html>
