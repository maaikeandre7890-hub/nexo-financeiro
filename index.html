
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXO | Inteligência Financeira B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-obsidian: #020617;
        --accent-emerald: #10b981;
      }
      body {
        background-color: var(--bg-obsidian);
        color: #f8fafc;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .glow-emerald {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg-obsidian); }
      ::-webkit-scrollbar-thumb { 
        background: #1e293b; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-emerald); }
      
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Nexo Prism Logo Animation */
      @keyframes logo-pulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
        50% { transform: scale(1.05) rotate(2deg); opacity: 0.8; }
      }
      .logo-prism {
        animation: logo-pulse 4s infinite ease-in-out;
      }
    </style>

  }
}
</script>
