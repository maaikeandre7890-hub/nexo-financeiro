
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-petroleum-base: #071821;
        --bg-petroleum-deep: #051118;
        --bg-surface: rgba(17, 37, 50, 0.6);
        --emerald-primary: #10b981;
        --border-glass: rgba(255, 255, 255, 0.06);
      }
      
      body {
        background-color: var(--bg-petroleum-base);
        color: #94A3B8;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.015em;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: 
          radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0, transparent 40%),
          radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0, transparent 40%),
          linear-gradient(180deg, var(--bg-petroleum-base) 0%, var(--bg-petroleum-deep) 100%);
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.02;
        pointer-events: none;
        z-index: -1;
      }

      .glass-card {
        background: var(--bg-surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        border-color: rgba(16, 185, 129, 0.2);
        background: rgba(20, 43, 58, 0.75);
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
      }

      /* Shimmer Effect para Elementos Premium */
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.03) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--emerald-primary); }

      .page-enter {
        animation: premiumReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes premiumReveal {
        from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      h1, h2, h3, .font-black {
        letter-spacing: -0.04em;
      }

      .oracle-chip {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(56, 189, 248, 0.08) 100%);
        border: 1px solid rgba(16, 185, 129, 0.25);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
      }
    </style>
