
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-petroleum-base: #020608;
        --emerald-primary: #10b981;
        --emerald-hover: #059669;
        --track-bg: #0a0f12;
      }
      
      html {
        scrollbar-gutter: stable;
        background-color: var(--bg-petroleum-base);
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        color: #94A3B8;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #nexo-bg-canvas {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-color: var(--bg-petroleum-base);
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.03) 0, transparent 50%),
          url('https://grainy-gradients.vercel.app/noise.svg');
        filter: contrast(150%) brightness(100%);
        opacity: 0.15;
        pointer-events: none;
        transform: translateZ(0);
      }

      /* SCROLLBAR REFINEMENT */
      .custom-scrollbar::-webkit-scrollbar { 
        width: 5px; 
        height: 5px; 
      }
      .custom-scrollbar::-webkit-scrollbar-track { 
        background: var(--track-bg); 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: var(--emerald-primary); 
        border-radius: 10px;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
        background: var(--emerald-hover); 
      }

      /* Firefox Support */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--emerald-primary) var(--track-bg);
      }

      .page-enter {
        animation: revealPage 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes revealPage {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
  </head>
  <body>
    <div id="nexo-bg-canvas"></div>
    <div id="root"></div>
  </body>
</html>
