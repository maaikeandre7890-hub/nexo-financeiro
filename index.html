
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* NEXO ENTERPRISE REFINED THEME */
        --bg-main: #0B0D10;
        --bg-sidebar: #0B0D10;
        --bg-card: #15181D;
        --bg-header: rgba(11, 13, 16, 0.95);
        
        --text-main: #FFFFFF;
        --text-muted: #B5B7BA;
        --text-deep: #8A8D91;
        
        --border-subtle: rgba(255, 255, 255, 0.06);
        --emerald-primary: #10b981;
        --emerald-hover: #059669;
        
        --track-bg: #0B0D10;
        --scrollbar-thumb: #10b981;
      }

      .light-theme {
        --bg-main: #F4F7F9;
        --bg-sidebar: #F4F7F9;
        --bg-card: #FFFFFF;
        --bg-header: rgba(244, 247, 249, 0.95);
        
        --text-main: #1A1C21;
        --text-muted: #4B4E52;
        --text-deep: #7A7D81;
        
        --border-subtle: rgba(16, 185, 129, 0.15);
        --track-bg: #E2E8F0;
      }
      
      html {
        scrollbar-gutter: stable;
        background-color: var(--bg-main);
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        color: var(--text-main);
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: var(--track-bg); }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: var(--emerald-primary); 
        border-radius: 10px; 
      }

      .page-enter { animation: revealPage 0.3s ease-out; }
      @keyframes revealPage {
        from { opacity: 0; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        transition: transform 0.2s ease;
      }

      .mono { font-family: 'JetBrains Mono', monospace; }
      
      h1, h2, h3, h4 { 
        letter-spacing: -0.01em; 
        color: var(--text-main);
      }
      
      label {
        color: var(--text-deep);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>

}
