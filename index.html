
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NEXO | Intelligence & Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-petroleum-base: #071821;
        --bg-petroleum-deep: #051118;
        --bg-surface: rgba(17, 37, 50, 0.5);
        --emerald-primary: #10b981;
        --border-glass: rgba(255, 255, 255, 0.08);
      }
      
      body {
        background-color: var(--bg-petroleum-base);
        color: #94A3B8;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: 
          radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0, transparent 40%),
          radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0, transparent 40%),
          linear-gradient(180deg, var(--bg-petroleum-base) 0%, var(--bg-petroleum-deep) 100%);
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.02;
        pointer-events: none;
        z-index: -1;
      }

      .glass-card {
        background: var(--bg-surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border-glass);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        border-color: rgba(16, 185, 129, 0.2);
        background: rgba(20, 43, 58, 0.65);
        transform: translateY(-2px);
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--emerald-primary); }

      .page-enter {
        animation: premiumReveal 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      }

      @keyframes premiumReveal {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      h1, h2, h3 {
        letter-spacing: -0.03em;
        font-weight: 800;
      }

      .oracle-chip {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(56, 189, 248, 0.05) 100%);
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 10px 40px rgba(16, 185, 129, 0.1);
      }

      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .safe-area-bottom {
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* Logo pulse effect */
      .nexus-pulse {
        animation: nexusBreathing 3s ease-in-out infinite;
      }

      @keyframes nexusBreathing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>

{

    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
